apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: vulnerable-app-ingress
  namespace: default
  annotations:
    kubernetes.io/ingress.class: "nginx"
    # WAF 설정 비활성화 (순수한 취약한 서버로 사용)
    nginx.ingress.kubernetes.io/enable-modsecurity: "false"
    nginx.ingress.kubernetes.io/enable-owasp-modsecurity-crs: "false"
  labels:
    app: vulnerable-app
spec:
  rules:
  - host: dvwatest.n-e.kr
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: vulnerable-app-service
            port:
              number: 80